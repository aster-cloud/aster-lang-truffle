# aster-lang-truffle 的类初始化策略（native-image 从 classpath 读取，任何含本库的原生构建都自动带上）。
# Truffle DSL 生成的类（AsterLanguageProvider、*Gen$InteropLibraryExports 等）必须在构建期初始化，否则镜像堆里出现
# 运行期类的对象而构建失败；Loader 与 embed 包持有静态 Jackson ObjectMapper，构建期初始化会把 jackson-yaml / snakeyaml
# 一并拉进镜像堆而失败，故这两处改回运行期。
Args = --initialize-at-build-time=aster.truffle \
       --initialize-at-run-time=aster.truffle.Loader,aster.truffle.embed
