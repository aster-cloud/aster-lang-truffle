name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限（CodeQL actions/missing-workflow-permissions）：本 workflow 仅 checkout
# + 构建 + 测试，无任何写操作（不推 commit/tag/release、不发镜像、不评论 PR、
# 不上传 SARIF、不做 OIDC 云登录）。跨仓 checkout 用的是 CROSS_REPO_TOKEN 而非
# GITHUB_TOKEN，故 GITHUB_TOKEN 只需只读 contents。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-lang-truffle

      # Shared version catalog (ADR 0012). Published into Maven Local the
      # same way as every other aster-lang dep below, so the catalog
      # import in settings.gradle resolves without a GitHub Packages
      # round-trip.
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 防漂移 gate（ADR 0023 阶段6）：本仓版本/platform pin 须符合 release-plan.json。
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 aster-lang-platform/scripts/release-plan/check-artifact.py \
            --plan aster-lang-platform/release-plan.json \
            --artifact truffle:maven --repo-root aster-lang-truffle

      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-runtime
          path: aster-lang-runtime
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # 语言包源：aster-lang-locales（现役，catalog 驱动）。旧独立 en/zh/de 仓已归档。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # hi 现在是独立 SPI 包，进了 platform 的 locales bundle —— 与 en/zh/de 一样
      # 需作为兄弟仓 checkout + 发布到 Maven Local，否则 runtimeClasspath 解析不到。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-hi
          path: aster-lang-hi
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # GoldenTestAdapter 的 golden 语料是 aster-lang-test 的 corpus/tier3-fixtures/golden-core/*.aster，
      # 经 CnlCompiler 编译为 Core IR v2 后执行（ADR 0055）。适配器缺语料即抛异常（不再返回空流
      # 伪装全绿），故这里必须把语料拉下来。PR 构建时 checkout-sibling 优先取同名分支
      # （feat/core-ir-v2 期间 core 也取同名分支，发布到 Maven Local 后供本仓编译）。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Publish dependencies to Maven Local
        run: |
          cd aster-lang-platform && ./gradlew publishToMavenLocal && cd ..
          cd aster-lang-core && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-runtime && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-locales && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-hi && ./gradlew publishToMavenLocal -x test && cd ..

      - name: Build & Test
        working-directory: aster-lang-truffle
        run: ./gradlew build -PexcludeBenchmarks=true

      # JVM aster CLI fat jar（ADR 0059 P1 T9）：build 已经过 :cli:checkCliJarSize（18 MiB 门）与 :cli:shadowJarSmokeTest；
      # 这里再独立核对一次产物存在、体积与 java -jar version，jar 缺失即失败。
      - name: aster-cli jar gate
        working-directory: aster-lang-truffle
        run: |
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          JAR="cli/build/libs/aster-cli-${VERSION}.jar"
          test -f "$JAR" || { echo "::error::缺少 $JAR"; exit 1; }
          BYTES=$(stat -c %s "$JAR")
          echo "aster-cli jar: $BYTES bytes"
          if [ "$BYTES" -gt $((18 * 1024 * 1024)) ]; then
            echo "::error::$JAR $BYTES 字节超过 18 MiB（ADR 0059 修订 1 A3）"; exit 1
          fi
          (cd cli/build/libs && sha256sum -c "aster-cli-${VERSION}.jar.sha256" aster.sha256 aster.cmd.sha256)
          java -jar "$JAR" version
          # 启动脚本（#188）与 jar 同目录：version 的 stdout 相同，stderr 为空
          test "$(sh cli/build/libs/aster version 2>/tmp/aster-launcher.err)" = "$(java -jar "$JAR" version)"
          test ! -s /tmp/aster-launcher.err || { cat /tmp/aster-launcher.err; exit 1; }

  # 原生可执行文件（ADR 0063，原生分发只作为安装渠道）：在各平台的原生 runner 上 ./gradlew :cli:nativeCompile（GraalVM 不能交叉编译），
  # 再用同一个 package-v1 一致性门验证——reachability 元数据缺失只会在原生产物上暴露，只能靠这道门发现：
  #   1. :cli:nativeSmoke —— 原生 version 与 fat jar 逐字节相同；
  #   2. :cli:nativeConformanceTest —— ConformanceCasesTest 以子进程跑原生可执行文件，全部用例对期望；
  #   3. aster-lang-test package-conformance.mjs --strict-formats —— 与 Node CLI（aster-lang-ts main）逐用例跨 CLI 比较。
  #      脚本的 jre 一侧固定为 `java -jar <jar>`，这里在 PATH 前面放一个 java 垫片把它换成原生可执行文件（脚本支持原生侧之后去掉，见计划）；
  #   4. test-package-v1.mjs —— 夹具生成器自测（不经 CLI），确认检出的夹具树完好。
  # 暂不进必需检查（分支保护与 .github/main-ci-gate.json 只有 build）：原生产物还没有发布渠道，依赖升级后的元数据漂移
  # 不应阻塞 JVM 制品的列车；原生资产进入 release.yml 时把本 job 加入必需检查（计划 T6）。
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            march: compatibility
          - target: linux-arm64
            os: ubuntu-24.04-arm
            march: ''
          - target: macos-arm64
            os: macos-14
            march: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-lang-truffle

      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-runtime
          path: aster-lang-runtime
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-hi
          path: aster-lang-hi
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-ts
          path: aster-lang-ts
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # Oracle GraalVM 25（GFTC），与 spike 实测的配置一致；CE 与否由 ADR 0063 的开放决策定，切换只改 distribution
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: aster-lang-ts/pnpm-lock.yaml

      - name: Publish dependencies to Maven Local
        run: |
          cd aster-lang-platform && ./gradlew publishToMavenLocal && cd ..
          cd aster-lang-core && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-runtime && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-locales && ./gradlew publishToMavenLocal -x test && cd ..
          cd aster-lang-hi && ./gradlew publishToMavenLocal -x test && cd ..

      - name: Build native executable
        working-directory: aster-lang-truffle
        run: |
          start=$(date +%s)
          ./gradlew :cli:nativeCompile ${{ matrix.march && format('-PnativeMarch={0}', matrix.march) || '' }}
          echo "nativeCompile: $(( $(date +%s) - start )) s"
          EXE=cli/build/native/nativeCompile/aster
          ls -l "$EXE"
          echo "native size: $(wc -c < "$EXE") bytes"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # 最低 glibc：动态符号里要求的最高 GLIBC_x.y（ADR 0063 平台矩阵）
            objdump -T "$EXE" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1
            ldd "$EXE"
          fi

      - name: Native smoke and conformance (JUnit)
        working-directory: aster-lang-truffle
        run: ./gradlew :cli:nativeSmoke :cli:nativeConformanceTest ${{ matrix.march && format('-PnativeMarch={0}', matrix.march) || '' }}

      - name: Build aster-lang-ts (Node CLI)
        working-directory: aster-lang-ts
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Cross-CLI package conformance (Node ↔ native)
        working-directory: aster-lang-test
        run: |
          VERSION=$(cd ../aster-lang-truffle && ./gradlew -q properties | sed -n 's/^version: //p' | head -n1)
          SHIM="$RUNNER_TEMP/native-shim"
          mkdir -p "$SHIM"
          # 把 package-conformance.mjs 的 `java -jar <jar> args…` 换成原生可执行文件
          printf '#!/bin/sh\n[ "$1" = "-jar" ] && shift 2\nexec "%s" "$@"\n' \
            "$GITHUB_WORKSPACE/aster-lang-truffle/cli/build/native/nativeCompile/aster" > "$SHIM/java"
          chmod +x "$SHIM/java"
          PATH="$SHIM:$PATH" node scripts/package-conformance.mjs \
            --node ../aster-lang-ts/dist/runner/aster.mjs \
            --jar "../aster-lang-truffle/cli/build/libs/aster-cli-${VERSION}.jar" \
            --concurrency 4 --strict-formats --report "$RUNNER_TEMP/native-conformance.md"

      - name: Package format v1 generator self-test
        working-directory: aster-lang-test
        run: node scripts/test-package-v1.mjs

      - name: Upload native executable and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-native-${{ matrix.target }}
          path: |
            aster-lang-truffle/cli/build/native/nativeCompile/aster
            ${{ runner.temp }}/native-conformance.md
          retention-days: 7
          if-no-files-found: ignore
